name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Scroll gesture regression tests
        run: ./scripts/test-pan-gesture.sh
      - name: Notch surface rendering regression tests
        run: ./scripts/test-notch-surface.sh
      - name: Update feed policy tests
        run: python3 scripts/test-update-pipeline.py
      - name: Integration tests
        run: swift test --package-path Packages/NotchIntegrations --scratch-path build/IntegrationPackage
      - name: Universal Release build
        run: ./scripts/build-app.sh Release 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO
      - name: HUD helper lifecycle regression tests
        run: ./scripts/test-hud-lifecycle.sh Release
      - name: Calendar automatic focus regression tests
        run: ./scripts/test-calendar-focus.sh Release
